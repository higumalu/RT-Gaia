# Static frontend + reverse proxy to the API (HTTP and WebSocket). The CPU rendering path needs COOP/COEP headers.
# The static root is /usr/share/nginx/html (copied in by the web stage). The Host header is passed through unchanged (the API
# checks it against the allow-list derived from RTGAIA_PUBLIC_URL); X-Forwarded-Proto decides the cookie Secure flag; .wasm gets the right MIME type.
server {
  listen 80;
  client_max_body_size 4g;   # import uploads (zip); matches the API's RTGAIA_IMPORT_BODY_MAX_BYTES (4 GiB)

  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;

  # Compress text assets (main bundle about 900 KB → 290 KB gzipped) and .wasm (about half)
  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # nginx 1.21+ already maps application/wasm; add .mjs in case the build ever emits it
  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/wasm wasm;
    application/json json map;
    application/manifest+json webmanifest;
    image/svg+xml svg svgz;
    image/png png;
    image/x-icon ico;
    image/jpeg jpg jpeg;
    image/webp webp;
    font/woff2 woff2;
    font/woff woff;
    text/plain txt;
  }

  # Shared by all locations (proxy_set_header is inherited only when a level has no proxy_set_header of its own)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location /healthz { proxy_pass http://api:8080/healthz; }
  location /readyz { proxy_pass http://api:8080/readyz; }

  # /assets/* file names carry a content hash: cache them long-term as immutable, and return 404 for missing files
  # (falling back to index.html would serve HTML as JavaScript and hide the missing file behind a MIME error).
  # Any add_header inside a location stops inheritance from the server level, so COOP/COEP are repeated in every location.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
  }

  # index.html and files without a hash (rtgaia_reslice.wasm, plugin-shims, branding) are revalidated every time (ETag → 304)
  # so a new version is picked up immediately; other SPA paths fall back to index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
  }
}
