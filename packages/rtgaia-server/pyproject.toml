[project]
name = "rtgaia-server"
version = "0.1.0"
description = "RT-Gaia production backend: SQL adapters (PostgreSQL and Alembic), create_app(), and the rtgaia-server, rtgaia-worker and rtgaia-scp processes"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rtgaia-core",
    # 目錄持久化：Postgres 為唯一生產目標；驅動選 asyncpg（Apache-2.0）
    # 而非 psycopg（LGPL）
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.scripts]
rtgaia-server = "rtgaia_server.cli:main"
rtgaia-worker = "rtgaia_server.worker_main:main"
rtgaia-scp = "rtgaia_server.scp_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtgaia_server"]
