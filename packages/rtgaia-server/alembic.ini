# Alembic。`sqlalchemy.url` 由程式以 RTGAIA_DB_URL 覆寫（db/migrate.py）；
# 手動用：cd packages/rtgaia-server && uv run alembic -x url=$RTGAIA_DB_URL upgrade head
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://rtgaia:rtgaia@127.0.0.1:5433/rtgaia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
