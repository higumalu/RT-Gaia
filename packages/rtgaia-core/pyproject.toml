[project]
name = "rtgaia-core"
version = "0.1.0"
description = "RT-Gaia product logic: domain model, loaders, catalog, algorithms, API routes, plugin host and DIMSE; no SQL, synthetic phantoms or test endpoints"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rtgaia-geom",
    # plugin 契約驗證器與 NIfTI 轉換與 check 工具同一份
    "rtgaia-plugin-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "zstandard>=0.22",
    "SimpleITK>=2.3",
    "pydicom>=2.4",
    "scikit-image>=0.24",
    "httpx>=0.27",
    "websockets>=13.0",
    # 3D 體積渲染：CPU fixed-point／GPU ray cast、EGL 離屏。BSD-3
    "vtk>=9.3",
    # 本地帳號：密碼雜湊。MIT
    "argon2-cffi>=23.1",
    # DIMSE：C-ECHO／C-FIND／C-STORE／C-MOVE／C-GET 與接收端 SCP。MIT
    "pynetdicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.3",
    "pylibjpeg-rle>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtgaia_core"]
