[project]
name = "rtgaia-dosecalc"
version = "0.1.0"
description = "RT-Gaia dose calculation: calculation packages, beam geometry, phantoms and engines (OpenTOPAS/Geant4 Monte Carlo in a container)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "rtgaia-geom",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydicom>=2.4",
]

[project.scripts]
rtgaia-dosecalc = "rtgaia_dosecalc.cli:main"

[project.optional-dependencies]
gpu = [
    "cupy-cuda13x[ctk]>=14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtgaia_dosecalc"]
